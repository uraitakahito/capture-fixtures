# pnpm 11 は依存の lifecycle script を既定で実行しない (strictDepBuilds)。走らせて
# よいものだけを明示する。
#
#   unrs-resolver — eslint-plugin-import-x が使う Rust 実装の path resolver。
#                   native bindings の link が要る
#
# 1 つだけ。推測ではなく実測で、allowBuilds を空にして install すると
# ERR_PNPM_IGNORED_BUILDS が unrs-resolver だけを名指しして落ちる。
#
# 兄弟リポジトリ (wacz-signer / browserhive) は esbuild も並べているが capture-fixtures には
# 要らない。vitest 4 が使うバンドラは rolldown で、esbuild はこのツリーに
# そもそも入っていない。wacz-signer は devDependencies が capture-fixtures と集合として同一
# なのに lockfile には esbuild を持つので、**設定を写す前に確かめること**。
#
# 実行時依存の fastify / @fastify/static は install script を持たない。
allowBuilds:
  unrs-resolver: true

# npm は pre<script> / post<script> を自動実行するが、pnpm は既定でしない。
# capture-fixtures は prebuild / pretypecheck / pretest / prelint の 4 つを持ち、どれも
# generate:version を呼ぶ。
#
# 欠けたときの壊れ方が tree の状態で変わるのが厄介で、clean checkout なら
# src/generated/version.ts が無いので TS2307 で明示的に落ちる (gitignore された
# 生成物なのでリポジトリには存在しない)。ところが生成物が残った tree では落ちず、
# 古い version と revision がそのまま焼き込まれる —— /__version は「何から焼いたか」
# を記録するための口なので、そこが嘘をつくのが一番避けたい壊れ方になる。
#
# 4 つの script を書き換えて明示的に呼ぶより、npm と同じ意味論を保つほうが
# 差分も事故も小さい。
enablePrePostScripts: true

# 親の範囲を越えて上げる依存。1 件ごとに、なぜ越えるかと、外す条件を書く。
overrides:
  # glob: GHSA-3g3m-2fjr-6pw4 (AbortSignal で止めた後も走査が続く) の修正は 14.0.2 からで、13 系には
  # 無い。@fastify/static は最新の 10.1.8 も glob ^13 を要求する。@fastify/static が glob を呼ぶのは
  # wildcard: false のときだけで、capture-fixtures は既定 (true) のまま登録している。14 は minimatch 11 を
  # 連れてくるので、実行時の木の minimatch (GHSA-g3hv-75wg-m249) もこれで消える。
  # 外す条件: @fastify/static が glob ^14 を要求する版を出したとき。
  "@fastify/static>glob": "^14.0.2"

# audit から外す勧告。外すのは、上流が修正版を受け取れず、override でも越えられないものだけ。
# 1 件ごとに、なぜ越えられないかと、外す条件を書く。
auditConfig:
  ignoreGhsas:
    # minimatch: globparts の増幅による DoS。修正は 11.0.1 (2026-10-27) からで、10 系には無い。
    # 11 は名前付きの書き出し makeRe をやめたので、override で 11 にすると eslint-plugin-import-x が
    # 読み込みで落ちる (実測。lint が "does not provide an export named 'makeRe'" で止まる)。
    # eslint 10.14・@eslint/config-array 0.23・@typescript-eslint/typescript-estree 8.72・import-x 4.17 の
    # 最新版がどれも ^10 を要求する。残る minimatch 10 は lint の道具の中だけで、読むパターンは eslint の
    # 設定と lint の対象 (この repo の物) だけ。実行時の木 (@fastify/static の下) は上の glob の override で
    # minimatch 11 になっている (`pnpm audit --prod` はこの行が無くても 0)。
    # 外す条件: これらの親が ^11 を要求する版を出したとき (そのとき update で直る)。
    - GHSA-g3hv-75wg-m249
