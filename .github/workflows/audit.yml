name: audit

# Known-vulnerability gate for both lockfiles: pnpm-lock.yaml (the fixtures app)
# and docs-site/package-lock.json (npm — `pnpm audit` never reads it).
#
# Advisories are published independently of our pull requests, so this also runs
# every day. On 2026-09-13 the docs-site lockfile carried a critical astro advisory
# and vitest a moderate one: Dependabot alerts were open, fix PRs sat unmerged, and
# nothing anywhere was red.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # No install: both audits read the lockfiles, not node_modules. The env
      # line is what makes that true. pnpm 11 installs dependencies before any
      # `pnpm run` when node_modules is missing (verifyDepsBeforeRun defaults to
      # `install`), and until it was set this job installed all 207 packages
      # before auditing. It also keeps the verdict about the lockfile as
      # committed: rejecting an out-of-date lockfile is the frozen install's job
      # in ci.yaml, not something to re-resolve here.
      - name: Audit both lockfiles
        run: pnpm run audit
        env:
          pnpm_config_verify_deps_before_run: "false"
