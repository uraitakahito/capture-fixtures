name: site

# Sync guard for the docs in docs-site/ (Astro/Starlight), so a pull request
# cannot merge documentation that points at renamed or deleted code.
#
# This runs `site:check` — build AND scripts/check-doc-refs.mjs — never
# `site:build` alone.
#
# The build is not a guard to rely on here. `astro build` injects `// #region`
# snippets via docs-site/src/lib/extract.ts, and a missing region makes that
# extractor throw — but whether the build then fails has depended on the page's
# extension and on the versions installed. On .mdx the throw surfaces through
# vite and the build exits 1; on .md Starlight's docs loader logs `[ERROR]
# [starlight-docs-loader] Error rendering …`, and with Starlight 0.41.4 /
# Astro 7.1.4 the build then exited 0, while with 0.41.11 / 7.4.4 it exits 1
# (measured 2026-11-13). Every page in capture-fixtures is .md. Measured, not
# assumed.
#
# check-doc-refs.mjs is the part that exits non-zero for both kinds, and it
# also catches what the build never sees: a `src/….ts` path written in prose
# that no longer exists.
#
# Security notes:
#   - This is a read-only CHECK. It never deploys and references no secrets;
#     permissions are contents:read only. Unlike docs.yml (which publishes to
#     Pages and therefore only runs on a release tag), running on pull_request is safe
#     here — there is no publish step, so a fork's PR cannot alter what is
#     served.
#   - Only docs-site/ dependencies are installed; the root install is not
#     needed to build the docs.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs-site/**'
      - 'scripts/check-doc-refs.mjs'
      - 'package.json'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'docs-site/**'
      - 'scripts/check-doc-refs.mjs'
      - 'package.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Docs sync guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The root is a pnpm project, docs-site/ is an npm one. pnpm is here only
      # to run the root's `site:check` script; the cache stays keyed on
      # docs-site's lockfile because that is the only one installed here.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs-site dependencies
        run: npm ci --prefix docs-site

      - name: Build site and verify doc references
        run: pnpm run site:check
