name: docker

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: capture-fixtures:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --rm --name smoke -p 8080:8080 capture-fixtures:smoke

      - name: Wait for readiness and probe scenarios
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health >/dev/null; then
              echo "capture-fixtures is up after ${i}s"
              break
            fi
            sleep 1
          done
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/plain-html)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/http-status/503)" = 503
          codes="$(for _ in 1 2 3; do curl -s -o /dev/null -w '%{http_code} ' 'http://localhost:8080/fails-then-succeeds?failTimes=2&key=ci'; done)"
          echo "fails-then-succeeds codes: $codes"
          test "$codes" = "503 503 200 "

      - name: Capture logs on failure
        if: failure()
        run: docker logs smoke || true

      - name: Stop container
        if: always()
        run: docker rm -f smoke || true
