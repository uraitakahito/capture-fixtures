name: safe-chain
on:
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      # safe-chain wraps pnpm as well as npm, so the guard still applies after
      # the migration. The tool itself is installed with npm because that is
      # what its own documentation prescribes; it is not a project dependency.
      - name: Setup safe-chain
        run: |
          npm i -g @aikidosec/safe-chain
          safe-chain setup-ci
      - name: Install dependencies
        env:
          SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: 5
        run: pnpm install --frozen-lockfile
